<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World Add-in</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 16px; color: #222; }
    h1 { color: #0078d4; font-size: 22px; }
    .box { background: #f3f2f1; border-radius: 6px; padding: 10px 12px; margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Hello World!</h1>
  <p>Your Outlook add-in is working.</p>
  <div class="box" id="subject">Loading email details…</div>

  <script>
    Office.onReady(function (info) {
      var el = document.getElementById("subject");
      if (info.host === Office.HostType.Outlook) {
        var item = Office.context.mailbox.item;
        el.textContent = "Current email subject: " + (item && item.subject ? item.subject : "(none)");
      } else {
        el.textContent = "Not running inside Outlook.";
      }
    });
  </script>
</body>
</html>
